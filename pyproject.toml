[project]
name = "audio-quality-api"
version = "0.1.0"
description = "FastAPI service for audio quality assessment"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "librosa>=0.11,<1.0",
    "numpy>=2.0,<2.5",
    "python-multipart>=0.0.9,<1.0",
    "starlette>=0.46,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.12,<1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
